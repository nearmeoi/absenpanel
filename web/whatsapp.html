<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp — AbsenPanel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">A</div><span>AbsenPanel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/"><span class="icon">📊</span> Dashboard</a>
                <a href="/console"><span class="icon">🖥️</span> Console</a>
                <a href="/files"><span class="icon">📁</span> Files</a>
                <a href="/whatsapp" class="active"><span class="icon">💬</span> WhatsApp</a>
                <a href="/users"><span class="icon">👥</span> Users</a>
                <a href="/settings"><span class="icon">⚙️</span> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" onclick="logout()">
                    <div class="avatar">A</div>
                    <div>
                        <div class="user-name">Admin</div>
                        <div class="user-role">Sign out</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main">
            <div class="topbar">
                <div class="page-title">WhatsApp Session</div>
            </div>
            <div class="content">
                <div class="card" style="max-width:480px">
                    <div class="card-header">
                        <span class="card-title">Session Status</span>
                        <span class="status-badge online" id="waStatus">Active</span>
                    </div>
                    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:20px">
                        Manage the WhatsApp session. If the bot disconnects, use Reset to clear the session and re-pair.
                    </p>
                    <div class="btn-group">
                        <button class="btn btn-danger" onclick="resetSession()">🗑️ Reset Session</button>
                        <button class="btn btn-warning" onclick="restartBot()">🔄 Restart Bot</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        async function resetSession() {
            if (!confirm('This will delete the WhatsApp session. You will need to re-pair the bot. Continue?')) return;
            showToast('Resetting session...', 'success');
            // This would call the API to delete SesiWA and restart
            try {
                await apiFetch('/api/bot/stop', { method: 'POST' });
                showToast('Bot stopped. Delete SesiWA via Console, then Start bot.', 'success');
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        }

        async function restartBot() {
            const res = await apiFetch('/api/bot/restart', { method: 'POST' });
            showToast(res.success ? 'Bot restarted' : 'Failed', res.success ? 'success' : 'error');
        }
    </script>
</body>

</html>
