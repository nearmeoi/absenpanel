<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console — AbsenPanel</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">A</div><span>AbsenPanel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/"><i class="ph ph-squares-four icon"></i> Dashboard</a>
                <a href="/console" class="active"><i class="ph ph-terminal icon"></i> Console</a>
                <a href="/files"><i class="ph ph-folder icon"></i> Files</a>
                <a href="/whatsapp"><i class="ph ph-whatsapp-logo icon"></i> WhatsApp</a>
                <a href="/users"><i class="ph ph-users icon"></i> Users</a>
                <a href="/settings"><i class="ph ph-gear icon"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" onclick="logout()">
                    <div class="avatar">A</div>
                    <div>
                        <div class="user-name">Admin</div>
                        <div class="user-role">Sign out</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main">
            <div class="topbar">
                <div class="page-title">Console</div>
                <div class="btn-group">
                    <button class="btn btn-ghost" onclick="clearTerminal()">Clear</button>
                    <button class="btn btn-warning" onclick="sendBotRestart()"><i class="ph ph-arrows-clockwise"></i> Restart Bot</button>
                </div>
            </div>

            <div class="content" style="padding:16px">
                <div class="terminal-wrapper">
                    <div class="terminal-toolbar">
                        <div class="dots">
                            <div class="dot red"></div>
                            <div class="dot yellow"></div>
                            <div class="dot green"></div>
                        </div>
                        <span style="font-size:12px;color:var(--text-muted)" id="connStatus">Connecting...</span>
                    </div>
                    <div class="terminal-body" id="terminal"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
        
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        const term = new Terminal({
            theme: {
                background: '#0a0e1a',
                foreground: '#e2e8f0',
                cursor: '#3b82f6',
                cursorAccent: '#0a0e1a',
                selectionBackground: 'rgba(59, 130, 246, 0.3)',
                black: '#1e293b',
                red: '#ef4444',
                green: '#22c55e',
                yellow: '#f59e0b',
                blue: '#3b82f6',
                magenta: '#a855f7',
                cyan: '#06b6d4',
                white: '#e2e8f0',
                brightBlack: '#64748b',
                brightRed: '#f87171',
                brightGreen: '#4ade80',
                brightYellow: '#fbbf24',
                brightBlue: '#60a5fa',
                brightMagenta: '#c084fc',
                brightCyan: '#22d3ee',
                brightWhite: '#f8fafc'
            },
            fontFamily: '"JetBrains Mono", "Fira Code", monospace',
            fontSize: 14,
            lineHeight: 1.3,
            cursorBlink: true,
            cursorStyle: 'bar',
            scrollback: 5000
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        // WebSocket connection
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${location.host}/api/terminal?token=${token}`);

        ws.onopen = () => {
            document.getElementById('connStatus').textContent = 'Connected';
            document.getElementById('connStatus').style.color = 'var(--success)';
            // Send initial size
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        };

        ws.onmessage = (e) => {
            if (e.data instanceof Blob) {
                e.data.text().then(text => term.write(text));
            } else {
                term.write(e.data);
            }
        };

        ws.onclose = () => {
            document.getElementById('connStatus').textContent = 'Disconnected';
            document.getElementById('connStatus').style.color = 'var(--danger)';
            term.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
        };

        ws.onerror = () => {
            document.getElementById('connStatus').textContent = 'Error';
            document.getElementById('connStatus').style.color = 'var(--danger)';
        };

        // User input → WebSocket
        term.onData(data => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });

        // Handle resize
        window.addEventListener('resize', () => {
            fitAddon.fit();
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            }
        });

        function clearTerminal() { term.clear(); }

        async function sendBotRestart() {
            try {
                const res = await apiFetch('/api/bot/restart', { method: 'POST' });
                showToast(res.success ? 'Bot restarted' : 'Failed', res.success ? 'success' : 'error');
            } catch (e) {
                showToast('Failed: ' + e.message, 'error');
            }
        }
    </script>
</body>

</html>
