<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AbsenPanel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="logo-area">
            <div class="brand-icon">A</div>
            <h1>AbsenPanel</h1>
            <p>Bot management console</p>
        </div>

        <div class="login-error" id="loginError"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
        </form>
    </div>
</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    btn.textContent = 'Signing in...';
    btn.disabled = true;
    err.style.display = 'none';

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });

        const data = await res.json();
        if (res.ok && data.token) {
            localStorage.setItem('token', data.token);
            document.cookie = `token=${data.token}; path=/; max-age=86400`;
            window.location.href = '/';
        } else {
            err.textContent = data.error || 'Login failed';
            err.style.display = 'block';
        }
    } catch (e) {
        err.textContent = 'Connection failed';
        err.style.display = 'block';
    }

    btn.textContent = 'Sign In';
    btn.disabled = false;
}
</script>
</body>
</html>
