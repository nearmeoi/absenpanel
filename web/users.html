<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — AbsenPanel</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">A</div><span>AbsenPanel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/"><i class="ph ph-squares-four icon"></i> Dashboard</a>
                <a href="/console"><i class="ph ph-terminal icon"></i> Console</a>
                <a href="/files"><i class="ph ph-folder icon"></i> Files</a>
                <a href="/whatsapp"><i class="ph ph-whatsapp-logo icon"></i> WhatsApp</a>
                <a href="/users" class="active"><i class="ph ph-users icon"></i> Users</a>
                <a href="/settings"><i class="ph ph-gear icon"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" onclick="logout()">
                    <div class="avatar">A</div>
                    <div>
                        <div class="user-name">Admin</div>
                        <div class="user-role">Sign out</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main">
            <div class="topbar">
                <div class="page-title">Registered Users</div>
            </div>
            <div class="content">
                <div class="card" style="padding:0">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Template</th>
                                </tr>
                            </thead>
                            <tbody id="userTable">
                                <tr>
                                    <td colspan="3" style="color:var(--text-muted)">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        async function loadUsers() {
            try {
                const data = await apiFetch('/api/users');
                const users = data.users || {};
                const tbody = document.getElementById('userTable');
                if (Object.keys(users).length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="color:var(--text-muted)">No users registered</td></tr>';
                    return;
                }
                let html = '';
                for (const [phone, user] of Object.entries(users)) {
                    const u = typeof user === 'string' ? JSON.parse(user) : user;
                    html += `<tr>
                <td>${phone}</td>
                <td>${u.email || '—'}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.template || '—'}</td>
            </tr>`;
                }
                tbody.innerHTML = html;
            } catch (e) {
                document.getElementById('userTable').innerHTML = `<tr><td colspan="3" style="color:var(--danger)">Error: ${e.message}</td></tr>`;
            }
        }
        loadUsers();
    </script>
</body>

</html>
