<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — AbsenPanel</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">A</div><span>AbsenPanel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/"><i class="ph ph-squares-four icon"></i> Dashboard</a>
                <a href="/console"><i class="ph ph-terminal icon"></i> Console</a>
                <a href="/files"><i class="ph ph-folder icon"></i> Files</a>
                <a href="/whatsapp"><i class="ph ph-whatsapp-logo icon"></i> WhatsApp</a>
                <a href="/users"><i class="ph ph-users icon"></i> Users</a>
                <a href="/settings" class="active"><i class="ph ph-gear icon"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" onclick="logout()">
                    <div class="avatar">A</div>
                    <div>
                        <div class="user-name">Admin</div>
                        <div class="user-role">Sign out</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main">
            <div class="topbar">
                <div class="page-title">Settings</div>
            </div>
            <div class="content">
                <!-- Change Password -->
                <div class="card" style="max-width:480px;margin-bottom:20px">
                    <div class="card-header">
                        <span class="card-title"><i class="ph ph-lock"></i> Change Password</span>
                    </div>
                    <form id="changePassForm" onsubmit="return handleChangePassword(event)">
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-input" id="oldPass" placeholder="••••••••" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-input" id="newPass" placeholder="Min. 6 characters"
                                required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-input" id="confirmPass" placeholder="••••••••" required
                                minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary" id="changePassBtn">
                            <i class="ph ph-check"></i> Update Password
                        </button>
                    </form>
                </div>

                <!-- Panel Info -->
                <div class="card" style="max-width:480px">
                    <div class="card-header">
                        <span class="card-title">Panel Info</span>
                    </div>
                    <div style="font-size:13px;color:var(--text-secondary)">
                        <p>AbsenPanel v1.0.0</p>
                        <p style="margin-top:8px">Built with Go + Vanilla JS</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/js/app.js"></script>
    <script>
        if (!localStorage.getItem('token')) window.location.href = '/login';

        async function handleChangePassword(e) {
            e.preventDefault();
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const btn = document.getElementById('changePassBtn');

            if (newPass !== confirmPass) {
                showToast('Passwords do not match', 'error');
                return false;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-spinner"></i> Updating...';

            try {
                const res = await apiFetch('/api/auth/change-password', {
                    method: 'POST',
                    body: JSON.stringify({ oldPassword: oldPass, newPassword: newPass })
                });

                if (res.success) {
                    showToast('Password updated successfully!', 'success');
                    document.getElementById('changePassForm').reset();
                } else {
                    showToast(res.error || 'Failed to update password', 'error');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="ph ph-check"></i> Update Password';
            return false;
        }
    </script>
</body>

</html>
